openapi: 3.1.0
info:
  title: dokumen-kita API
  version: 1.0.0
  description: |
    Kontrak endpoint workflow signing serta riwayat dokumen. Endpoint auth, draft, impor, dan konversi belum dicakup.
    Sesi cookie Sanctum; SPA terlebih dahulu mengambil cookie CSRF dan mengirim
    X-XSRF-TOKEN pada request yang mengubah state. Semua path memakai GUID.
    Owner dapat menjadi signer pada urutan mana pun dan tetap menunggu giliran.
    Email dinormalisasi trim + lowercase tanpa mengubah titik atau plus.
    Publish memerlukan preview privat yang siap, hash SHA-256 cocok, jumlah
    halaman tersimpan, dan placeholder yang sudah ditinjau ulang.
    Renderer dan worker email tersedia di aplikasi; operasi hosting dan delivery inbox tetap bergantung pada runtime.
servers:
  - url: /api/v1
x-realtime:
  transport: Pusher Channels
  authorization:
    url: /broadcasting/auth
    middleware: [api, auth:sanctum]
    private_channel: private-users.{userGuid}
    rule: authenticated user GUID must match userGuid
  event: document.status.changed
  event_types:
    assignment.ready: owner and claimed active signer
    assignment.signed: owner
    version.revision_requested: owner
    version.rejected: owner
    version.final_pdf_ready: owner
    version.final_pdf_failed: owner
  payload: [notification_guid, event_type, document_guid, version_guid, version_status, assignment_guid, assignment_status]
  delivery: durable outbox; 3 attempts with 1-minute and 5-minute delays; consumers can deduplicate by notification_guid
  recovery: On reconnect or a missed event, refresh GET /documents/{documentGuid} or GET /versions/{versionGuid}; event payload is only a refresh hint.
security:
  - sessionCookie: []
paths:
  /documents/{documentGuid}/audit:
    parameters:
      - name: documentGuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listDocumentAuditEvents
      summary: Baca timeline audit dokumen
      description: Owner melihat semua event; signer hanya event pada versi yang menugaskannya. Maksimal 100 item per halaman.
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          $ref: '#/components/responses/AuditEventPage'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /documents/{documentGuid}/versions:
    parameters:
      - name: documentGuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listDocumentVersions
      summary: Baca riwayat versi dokumen
      description: Owner melihat semua versi; signer hanya versi yang menugaskannya. Urutan terbaru lebih dulu.
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          $ref: '#/components/responses/VersionPage'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /documents/{documentGuid}/emails:
    parameters:
      - name: documentGuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listDocumentEmailDeliveries
      summary: Baca status outbox email sebagai owner
      description: Status queued berarti menunggu worker, sent berarti diterima transport, failed berarti retry habis; tidak membuktikan email masuk inbox.
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          $ref: '#/components/responses/EmailNotificationPage'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /versions/{versionGuid}/signers:
    parameters:
      - $ref: '#/components/parameters/VersionGuid'
    put:
      operationId: updateVersionSigners
      summary: Ganti daftar penerima draft sebagai owner
      description: |
        Urutan wajib 1..N tanpa celah atau duplikasi. Array kosong menghapus
        daftar draft; publish menolaknya. Penerima yang dipertahankan tetap
        memiliki GUID dan placeholder yang sama ketika urutannya berubah.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signers]
              properties:
                signers:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [email, sequence_number]
                    properties:
                      email:
                        type: string
                        format: email
                        maxLength: 255
                      sequence_number:
                        type: integer
                        minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/Version'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /assignments/{assignmentGuid}/placeholders:
    parameters:
      - $ref: '#/components/parameters/AssignmentGuid'
    put:
      operationId: updateAssignmentPlaceholders
      summary: Ganti dan tinjau ulang placeholder draft sebagai owner
      description: |
        Posisi terhadap halaman PDF setelah rotasi, ternormalisasi 0..1.
        x + width dan y + height tidak boleh melebihi 1. Nomor halaman
        harus tersedia pada preview. Maksimal enam angka desimal.
        Array kosong menghapus posisi tanpa mensyaratkan preview siap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [placeholders]
              properties:
                placeholders:
                  type: array
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/Position'
      responses:
        '200':
          $ref: '#/components/responses/Assignment'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /versions/{versionGuid}/publish:
    parameters:
      - $ref: '#/components/parameters/VersionGuid'
    post:
      operationId: publishVersion
      summary: Bekukan draft dan buat undangan serta outbox secara atomik
      description: |
        Owner saja. Signer pertama menjadi ready, sisanya waiting.
        Retry versi terkini yang sudah in_progress, finalizing, atau completed
        mengembalikan resource tanpa mengulang audit, token, atau outbox.
        Versi lama, terminal, atau dokumen dengan versi aktif lain ditolak.
        Tidak menerima perubahan manifest dari request ini.
        Maksimal 20 request per menit per akun.
      responses:
        '200':
          $ref: '#/components/responses/Version'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /invitations/claim:
    post:
      operationId: claimInvitation
      summary: Ikat undangan ke akun dengan email terverifikasi yang cocok
      description: |
        Token berupa 32 byte acak yang dikodekan menjadi 64 karakter hex.
        Default berlaku 7 hari, dikonfigurasi melalui INVITATION_EXPIRES_DAYS.
        Claim pada assignment waiting tidak membuka giliran maupun konten.
        Retry akun yang sama tidak menggandakan audit claim.
        Token tidak valid, revoked, expired, atau email tidak cocok mendapat
        INVITATION_INVALID yang sama. Maksimal 10 request/menit per akun + IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
                  minLength: 64
                  maxLength: 64
      responses:
        '200':
          $ref: '#/components/responses/Assignment'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /assignments/{assignmentGuid}/resend-invitation:
    parameters:
      - $ref: '#/components/parameters/AssignmentGuid'
    post:
      operationId: resendAssignmentInvitation
      summary: Cabut token lama dan antrekan undangan baru sebagai owner
      description: |
        Hanya pada versi terkini in_progress dan assignment ready.
        Assignment waiting belum memiliki undangan aktif untuk dikirim ulang.
        Token lama dicabut, outbox undangan queued/failed dibatalkan serta
        payloadnya dihapus. Maksimal 3 request/menit per owner + assignment.
        Respons tidak memuat token atau URL undangan.
      responses:
        '200':
          $ref: '#/components/responses/Assignment'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /assignments/{assignmentGuid}/reject:
    parameters:
      - $ref: '#/components/parameters/AssignmentGuid'
    post:
      operationId: rejectAssignment
      summary: Tolak versi sebagai signer aktif
      description: Penolakan terminal. Menyimpan alasan dan audit, mencabut undangan, menghentikan giliran, dan mengantrekan notifikasi owner. Tidak membuat draft revisi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectionInput'
      responses:
        '200':
          description: Versi ditolak.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/RejectionResult'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /versions/{versionGuid}/source:
    parameters:
      - $ref: '#/components/parameters/VersionGuid'
    get:
      operationId: downloadVersionSource
      summary: Unduh sumber privat sebagai owner
      description: Source hanya dapat dibaca owner; file PDF ditampilkan inline, DOCX diunduh sebagai attachment. Storage key tidak dikembalikan.
      responses:
        '200':
          description: Berkas sumber privat.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /versions/{versionGuid}/finalize:
    parameters:
      - $ref: '#/components/parameters/VersionGuid'
    post:
      operationId: retryVersionFinalization
      summary: Antre ulang finalisasi versi sebagai owner
      description: Hanya versi terkini berstatus finalizing. Jika gagal, error dibersihkan dan worker memproses ulang; respons 202 berarti diterima, bukan PDF selesai.
      responses:
        '202':
          $ref: '#/components/responses/Version'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /versions/{versionGuid}/pdf:
    parameters:
      - $ref: '#/components/parameters/VersionGuid'
    get:
      operationId: viewVersionPdf
      summary: Stream preview, snapshot, atau PDF final sesuai Policy
      description: |
        Owner dapat membaca preview siap dan setiap versi historis.
        Recipient waiting/cancelled mendapat 403; outsider mendapat 404.
        Recipient ready/signed/revision_requested/rejected dapat membaca versi
        assignment miliknya. completed menyajikan final PDF yang hash-nya cocok;
        state lain menyajikan snapshot. Respons tidak memuat URL storage.
      responses:
        '200':
          description: PDF privat dengan Cache-Control private, no-store.
          headers:
            X-Document-Content-Hash:
              description: Hash snapshot untuk confirmation/signature, bukan hash PDF final.
              schema:
                type: string
                pattern: '^[a-f0-9]{64}$'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /assignments/{assignmentGuid}/read-confirmation:
    parameters:
      - $ref: '#/components/parameters/AssignmentGuid'
    post:
      operationId: confirmAssignmentRead
      summary: Simpan pernyataan eksplisit membaca snapshot sebagai signer ready
      description: |
        Akun terikat dan email terverifikasi; versi terkini in_progress dan
        assignment ready untuk confirmation baru. Pernyataan ini bukan bukti
        objektif bahwa pengguna telah membaca semua halaman. Hash harus cocok.
        Retry mengembalikan confirmation yang sama tanpa audit tambahan,
        termasuk sesudah signed selama versi terkini masih aktif/finalizing/completed.
        Maksimal 30 request per menit per akun.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationInput'
      responses:
        '201':
          $ref: '#/components/responses/ReadConfirmation'
        '200':
          $ref: '#/components/responses/ReadConfirmation'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /assignments/{assignmentGuid}/signatures:
    parameters:
      - $ref: '#/components/parameters/AssignmentGuid'
    post:
      operationId: signAssignment
      summary: Tanda tangan atomik dan pergantian giliran
      description: |
        Signer ready dengan email terverifikasi, read confirmation pada hash
        snapshot yang sama, dan asset privat miliknya. Satu tindakan mengisi
        seluruh placeholder assignment. Owner yang menjadi signer tidak dapat
        melompati urutan. Request yang sama (key, asset, hash) mengembalikan
        signature sama; retry berbeda mendapat IDEMPOTENCY_CONFLICT.
        Aktifkan penerima berikutnya dan antrekan undangan ready baru; token
        pending lama dicabut. Signer terakhir memindahkan versi/document
        ke finalizing dan mencatat outbox version_finalizing; tidak mengklaim
        PDF final sudah tersedia. Maksimal 30 request per menit per akun.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ConfirmationInput'
                - type: object
                  required: [asset_guid, idempotency_key]
                  properties:
                    asset_guid:
                      type: string
                      format: uuid
                    idempotency_key:
                      type: string
                      minLength: 1
                      maxLength: 64
                      pattern: '^[a-zA-Z0-9_-]+$'
      responses:
        '201':
          $ref: '#/components/responses/Signature'
        '200':
          $ref: '#/components/responses/Signature'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /signature-assets:
    get:
      operationId: listOwnSignatureAssets
      summary: Library aset tanda tangan milik sendiri
      description: Pagination 15 item/halaman, diurutkan id descending secara stabil.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Aset milik akun; tidak memuat object key privat.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, links]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SignatureAsset'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      total:
                        type: integer
                      per_page:
                        type: integer
                  links:
                    type: object
        '401':
          $ref: '#/components/responses/Error'
    post:
      operationId: createSignatureAsset
      summary: Simpan coretan canvas atau upload gambar tanda tangan immutable
      description: |
        PNG/JPEG/WebP; isi/MIME, ekstensi, ukuran, dan dimensi diperiksa.
        Default batas 2048 KiB, dimensi 16..2048 x 16..1024, masih placeholder B04.
        Gambar putih, transparan kosong, dan warna solid ditolak. Normalisasi PNG
        membuang metadata input dan menyimpan objek privat baru dengan hash.
        source_type drawn untuk canvas baru; upload untuk gambar unggahan.
        Aset tersimpan digunakan ulang melalui asset_guid saat submit signature,
        dengan confirmation baru pada setiap assignment. Tidak ada endpoint edit.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, source_type]
              properties:
                file:
                  type: string
                  format: binary
                source_type:
                  type: string
                  enum: [drawn, upload]
      responses:
        '201':
          $ref: '#/components/responses/SignatureAsset'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /signature-assets/{assetGuid}/image:
    get:
      operationId: viewOwnSignatureAsset
      summary: Stream gambar aset milik sendiri
      parameters:
        - name: assetGuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: PNG privat; hash diverifikasi, cache dinonaktifkan.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: laravel-session
      description: Nama cookie mengikuti SESSION_COOKIE; default aplikasi laravel-session.
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    VersionGuid:
      name: versionGuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentGuid:
      name: assignmentGuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RejectionInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 1000
    RejectionResult:
      type: object
      required: [assignment_guid, assignment_status, version_guid, version_status, reason]
      properties:
        assignment_guid:
          type: string
          format: uuid
        assignment_status:
          type: string
          const: rejected
        version_guid:
          type: string
          format: uuid
        version_status:
          type: string
          const: rejected
        reason:
          type: string
    AuditEvent:
      type: object
      required: [guid, version_guid, actor_guid, action, metadata, created_at]
      properties:
        guid:
          type: string
          format: uuid
        version_guid:
          type: [string, 'null']
          format: uuid
        actor_guid:
          type: [string, 'null']
          format: uuid
        action:
          type: string
        metadata:
          type: [object, 'null']
        created_at:
          type: string
          format: date-time
    EmailNotification:
      type: object
      required: [guid, version_guid, assignment_guid, recipient_email, notification_type, status, attempt_count, scheduled_at, sent_at, last_error_code, created_at]
      properties:
        guid:
          type: string
          format: uuid
        version_guid:
          type: string
          format: uuid
        assignment_guid:
          type: [string, 'null']
          format: uuid
        recipient_email:
          type: string
          format: email
        notification_type:
          type: string
        status:
          type: string
          enum: [queued, sent, failed, cancelled]
        attempt_count:
          type: integer
        scheduled_at:
          type: [string, 'null']
          format: date-time
        sent_at:
          type: [string, 'null']
          format: date-time
        last_error_code:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
    AuditEventCollection:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        links:
          type: object
        meta:
          type: object
    VersionCollection:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Version'
        links:
          type: object
        meta:
          type: object
    EmailNotificationCollection:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmailNotification'
        links:
          type: object
        meta:
          type: object
    ConfirmationInput:
      type: object
      required: [confirmed, version_content_hash]
      properties:
        confirmed:
          type: boolean
          const: true
        version_content_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
    ReadConfirmation:
      type: object
      required: [guid, assignment_guid, version_content_hash, confirmed_at]
      properties:
        guid:
          type: string
          format: uuid
        assignment_guid:
          type: string
          format: uuid
        version_content_hash:
          type: string
        confirmed_at:
          type: string
          format: date-time
    Signature:
      type: object
      required: [guid, assignment_guid, asset_guid, version_content_hash, signed_at]
      properties:
        guid:
          type: string
          format: uuid
        assignment_guid:
          type: string
          format: uuid
        asset_guid:
          type: string
          format: uuid
        version_content_hash:
          type: string
        signed_at:
          type: string
          format: date-time
    SignatureAsset:
      type: object
      required: [guid, source_type, mime_type, width, height, size_bytes, image_url, created_at]
      properties:
        guid:
          type: string
          format: uuid
        source_type:
          type: string
          enum: [drawn, upload]
        mime_type:
          type: [string, 'null']
        width:
          type: [integer, 'null']
        height:
          type: [integer, 'null']
        size_bytes:
          type: [integer, 'null']
        image_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
    Position:
      type: object
      additionalProperties: false
      required: [page_number, x, y, width, height]
      properties:
        page_number:
          type: integer
          minimum: 1
        x:
          type: number
          minimum: 0
          maximum: 1
          multipleOf: 0.000001
        y:
          type: number
          minimum: 0
          maximum: 1
          multipleOf: 0.000001
        width:
          type: number
          minimum: 0.000001
          maximum: 1
          multipleOf: 0.000001
        height:
          type: number
          minimum: 0.000001
          maximum: 1
          multipleOf: 0.000001
    Placeholder:
      type: object
      required: [guid, page_number, x, y, width, height, needs_review]
      properties:
        guid:
          type: string
          format: uuid
        page_number:
          type: integer
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        needs_review:
          type: boolean
    Assignment:
      type: object
      required: [guid, version_guid, recipient_email, sequence_number, status, claimed_at]
      properties:
        guid:
          type: string
          format: uuid
        version_guid:
          type: string
          format: uuid
        recipient_email:
          type: string
          format: email
        sequence_number:
          type: integer
        status:
          type: string
          enum: [waiting, ready, signed, revision_requested, rejected, cancelled]
        claimed_at:
          type: [string, 'null']
          format: date-time
        placeholders:
          type: array
          description: Tersedia jika dimuat; disembunyikan untuk recipient waiting.
          items:
            $ref: '#/components/schemas/Placeholder'
        read_confirmation:
          description: Jika dimuat; disembunyikan untuk recipient waiting.
          oneOf:
            - $ref: '#/components/schemas/ReadConfirmation'
            - type: 'null'
        signature:
          description: Jika dimuat; disembunyikan untuk recipient waiting.
          oneOf:
            - $ref: '#/components/schemas/Signature'
            - type: 'null'
    Version:
      type: object
      required: [guid, document_guid, version_number, status, preview_status, published_at, created_at, updated_at]
      properties:
        guid:
          type: string
          format: uuid
        document_guid:
          type: string
          format: uuid
        version_number:
          type: integer
        status:
          type: string
          enum: [draft, preparing, in_progress, finalizing, completed, revision_requested, superseded, rejected]
        preview_status:
          type: string
          enum: [none, stale, queued, ready, failed]
        preview_page_count:
          type: [integer, 'null']
          description: Owner saja.
        content_hash:
          type: [string, 'null']
          description: Owner atau signer yang berhak membaca PDF saja.
        assignments:
          type: array
          description: Owner melihat semua; recipient hanya assignment miliknya.
          items:
            $ref: '#/components/schemas/Assignment'
        source_type:
          type: [string, 'null']
          enum: [pdf, docx, null]
        has_source:
          type: boolean
        editor_data:
          type: [object, 'null']
          description: Owner saja.
        published_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message, errors]
          properties:
            code:
              type: string
              description: |
                UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, VALIDATION_FAILED,
                EMAIL_NOT_VERIFIED, VERSION_NOT_EDITABLE, VERSION_CONFLICT,
                ACTIVE_VERSION_EXISTS, SIGNERS_INVALID, PREVIEW_NOT_READY,
                PREVIEW_MISMATCH, PLACEHOLDERS_REQUIRED, PLACEHOLDERS_INVALID,
                PLACEHOLDERS_NEED_REVIEW, INVITATION_INVALID,
                INVITATION_NOT_ACTIVE, INVITATION_ALREADY_CLAIMED,
                TOO_MANY_REQUESTS, CSRF_TOKEN_MISMATCH.
                BE05 menambah PDF_NOT_READY, PDF_MISMATCH, CONTENT_HASH_MISMATCH,
                ASSIGNMENT_NOT_READY, VERSION_NOT_SIGNABLE, READ_CONFIRMATION_REQUIRED,
                READ_CONFIRMATION_MISMATCH, IDEMPOTENCY_CONFLICT, SIGNING_ORDER_CONFLICT,
                SIGNATURE_IMAGE_INVALID, SIGNATURE_IMAGE_EMPTY,
                SIGNATURE_ASSET_UNAVAILABLE, SIGNATURE_ASSET_CHANGED,
                ASSIGNMENT_ALREADY_RESOLVED, REVISION_ALREADY_RESOLVED,
                VERSION_NOT_SIGNABLE, VERSION_CONFLICT.
            message:
              type: string
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
        meta:
          $ref: '#/components/schemas/Meta'
  responses:
    ReadConfirmation:
      description: Confirmation baru (201) atau hasil retry (200).
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                $ref: '#/components/schemas/ReadConfirmation'
              meta:
                $ref: '#/components/schemas/Meta'
    Signature:
      description: Signature baru (201) atau hasil retry request sama (200).
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                $ref: '#/components/schemas/Signature'
              meta:
                $ref: '#/components/schemas/Meta'
    SignatureAsset:
      description: Aset PNG privat baru.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                $ref: '#/components/schemas/SignatureAsset'
              meta:
                $ref: '#/components/schemas/Meta'
    Version:
      description: Resource versi; header X-Request-Id sesuai meta.request_id.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                $ref: '#/components/schemas/Version'
              meta:
                $ref: '#/components/schemas/Meta'
    Assignment:
      description: Resource assignment; header X-Request-Id sesuai meta.request_id.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                $ref: '#/components/schemas/Assignment'
              meta:
                $ref: '#/components/schemas/Meta'
    Error:
      description: |
        Error terstruktur. Outsider mendapat 404; recipient yang bukan owner
        mendapat 403 saat mengatur/publish/resend. State konflik mendapat 409,
        bentuk input atau token invalid mendapat 422. CSRF dapat mendapat 419.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AuditEventPage:
      description: Halaman event audit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuditEventCollection'
    VersionPage:
      description: Halaman versi.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VersionCollection'
    EmailNotificationPage:
      description: Halaman status outbox email.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailNotificationCollection'
